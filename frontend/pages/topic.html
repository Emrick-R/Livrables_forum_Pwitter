<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pwitter - Topic</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="../index.html" class="navbar-logo">
            <img src="../assets/Colombe en vol sur fond dégradé.png" alt="Logo Pwitter" class="logo-img">
            <span class="logo-texte">Pwitter</span>
        </a>
        <div class="navbar-actions">
            <button id="btn-theme" onclick="toggleTheme()" title="Changer le thème">🌙</button>
            <div id="nav-auth" style="display:flex;gap:10px;align-items:center"></div>
        </div>
    </nav>

    <div class="container" style="display:block;max-width:860px">

        <a href="../index.html" style="display:inline-flex;align-items:center;gap:6px;font-size:0.88rem;color:var(--texte-doux);margin-bottom:16px">
            ← Retour aux topics
        </a>

        <div id="topic-header">
            <div class="message-vide">Chargement...</div>
        </div>

        <div class="messages-entete">
            <h3 id="nb-messages">Réponses</h3>
            <div class="tri-options">
                <button class="btn-tri actif" onclick="changerTriMessages('date', this)">Récents</button>
                <button class="btn-tri" onclick="changerTriMessages('score', this)">Populaires</button>
            </div>
        </div>

        <div id="messages-container">
            <div class="message-vide">Chargement des messages...</div>
        </div>

        <div class="pagination" id="pagination-messages"></div>

        <div id="zone-composer"></div>

    </div>

    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/topic.js"></script>
</body>
</html>
