<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pwitter - Connexion</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>


    <nav class="navbar">
        <a href="../index.html" class="navbar-logo">
            <img src="../assets/Colombe en vol sur fond dégradé.png" alt="Logo Pwitter" class="logo-img">
            <span class="logo-texte">Pwitter</span>
        </a>
        <div class="navbar-actions">
            <button id="btn-theme" onclick="toggleTheme()" title="Changer le thème">🌙</button>
        </div>
    </nav>


    <div class="form-page">
        <div class="form-card">
            <h1>Connexion</h1>
            <p class="sous-titre">Content de te revoir sur Pwitter </p>

            <div class="alerte erreur" id="alerte-erreur"></div>

            <form id="form-login" onsubmit="seConnecter(event)">

                <div class="form-group">
                    <label for="identifiant">Pseudo ou adresse mail</label>
                    <input
                        type="text"
                        id="identifiant"
                        placeholder="ton_pseudo ou email@exemple.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="motDePasse">Mot de passe</label>
                    <input
                        type="password"
                        id="motDePasse"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn-gradient btn-full" id="btn-submit">
                    Se connecter
                </button>
            </form>

            <div class="form-lien">
                Pas encore de compte ? <a href="register.html">S'inscrire</a>
            </div>
        </div>
    </div>

    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
