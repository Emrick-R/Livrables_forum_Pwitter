<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pwitter - Nouveau topic</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Styles spécifiques à la sélection de tags */
        .tags-selection {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .tag-choix {
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid var(--bordure);
            background: transparent;
            color: var(--texte-doux);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .tag-choix.selectionne {
            background: rgba(96, 200, 240, 0.15);
            color: var(--bleu);
            border-color: rgba(96, 200, 240, 0.4);
            font-weight: 600;
        }

        .tag-choix:hover {
            background: var(--bg-hover);
        }

        .nouveau-tag {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .nouveau-tag input {
            flex: 1;
            padding: 7px 12px;
            border-radius: 20px;
            border: 1px solid var(--bordure);
            background: var(--bg-input);
            color: var(--texte);
            font-size: 0.85rem;
            outline: none;
        }

        .nouveau-tag input:focus {
            border-color: var(--bleu);
        }

        .compteur-corps {
            text-align: right;
            font-size: 0.78rem;
            color: var(--texte-doux);
            margin-top: 4px;
        }

        .form-card-large {
            max-width: 700px;
        }
    </style>
</head>
<body>


    <nav class="navbar">
        <a href="../index.html" class="navbar-logo">
            <img src="/assets/Colombe en vol sur fond dégradé.png" alt="Logo Pwitter" class="logo-img">
            <span class="logo-texte">Pwitter</span>
        </a>
        <div class="navbar-actions">
            <button id="btn-theme" onclick="toggleTheme()" title="Changer le thème">🌙</button>
            <div id="nav-auth" style="display:flex;gap:10px;align-items:center"></div>
        </div>
    </nav>

    <div class="form-page" style="align-items:flex-start;padding-top:32px">
        <div class="form-card form-card-large">

            <a href="/" style="font-size:0.85rem;color:var(--texte-doux);display:inline-block;margin-bottom:16px">
                ← Retour
            </a>

            <h1>Nouveau topic</h1>
            <p class="sous-titre">Lance une discussion sur Pwitter</p>

            <div class="alerte erreur" id="alerte-erreur"></div>

            <form id="form-topic" onsubmit="creerTopic(event)">

                <div class="form-group">
                    <label for="titre">Titre</label>
                    <input
                        type="text"
                        id="titre"
                        placeholder="Un titre clair et précis"
                        maxlength="150"
                        required
                    >
                    <span class="form-erreur" id="err-titre"></span>
                </div>

                <div class="form-group">
                    <label for="corps">Contenu</label>
                    <textarea
                        id="corps"
                        placeholder="Développe ton sujet ici..."
                        rows="8"
                        required
                        oninput="mettreAJourCompteur()"
                    ></textarea>
                    <div class="compteur-corps"><span id="compteur">0</span> caractères</div>
                    <span class="form-erreur" id="err-corps"></span>
                </div>

                <div class="form-group">
                    <label>Tags <span style="font-weight:400;color:var(--texte-doux)">(choisis un ou plusieurs)</span></label>
                    <div class="tags-selection" id="tags-selection">
                        <p style="color:var(--texte-doux);font-size:0.88rem">Chargement des tags...</p>
                    </div>
                    <span class="form-erreur" id="err-tags"></span>


                    <div class="nouveau-tag">
                        <input type="text" id="nouveau-tag-input" placeholder="Nouveau tag...">
                        <button type="button" class="btn-outline" onclick="ajouterNouveauTag()">+ Ajouter</button>
                    </div>
                </div>

                <button type="submit" class="btn-gradient btn-full" id="btn-submit">
                    Publier le topic
                </button>
            </form>
        </div>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/create-topic.js"></script>
</body>
</html>
